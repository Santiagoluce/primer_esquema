version: "3.8"

services:
  # 🚪 Gateway
  gateway:
    container_name: c-gateway
    build: ./
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      CUSTOMERS_URL: http://customers:8001
      PRODUCTS_URL: http://products:8002
      SHOPPING_URL: http://shopping-app:8003
    depends_on:
      - customers
      - products
      - shopping-app
    networks:
      - app-net

  # 👤 Customers microservice
  customers:
    container_name: c-customers
    build: ../customers
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DB_URL: mongodb://customers-db:27017/customers
      APP_SECRET: dev-secret-change-me
    depends_on:
      - customers-db
    networks:
      - app-net

  customers-db:
    container_name: c-customers-db
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - customers-data:/data/db
    networks:
      - app-net

  # 📦 Products microservice
  products:
    container_name: c-products
    build: ../products
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DB_URL: mongodb://products-db:27017/products
    depends_on:
      - products-db
    networks:
      - app-net

  products-db:
    container_name: c-products-db
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - products-data:/data/db
    networks:
      - app-net

  # 🛒 Shopping microservice
  shopping-app:
    container_name: c-shopping
    build: ../shopping
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_URL: mongodb://shopping-db:27017/shopping
      APP_SECRET: dev-secret-change-me
    depends_on:
      - shopping-db
    networks:
      - app-net

  shopping-db:
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - shopping-data:/data/db
    networks:
      - app-net

# 📂 Volúmenes para persistencia
volumes:
  customers-data:
  products-data:
  shopping-data:

# 🌐 Red compartida
networks:
  app-net:
    driver: bridge
