services:
  api:
    container_name: backend-mono-api
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DB_URL: mongodb://mongo:27017/enfasis-i
      APP_SECRET: $(APP_SECRET:-dev-secret-change-me)
    depends_on:
      - mongo
  mongo:
  container_name: backend-db
  image: mongo:7
  ports:
    - "27017:27017"
  volumes:
    - mongo-data:/data/db
    
volumes:
  mongo-data: